<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <a
        class="footer__logo"
        routerLink="/"
        [attr.aria-label]="t().footer.backToTop"
        (click)="scrollToTop()"
      >
        <img
          class="footer__logo-default"
          src="logo/logo.png"
          [alt]="t().footer.logoAlt"
          width="814"
          height="214"
        />
        <img
          class="footer__logo-hover"
          src="logo/logo1.png"
          alt=""
          aria-hidden="true"
          width="814"
          height="214"
        />
      </a>

      <div class="footer__info">
        <p>{{ t().footer.role }}</p>
        <p>{{ t().footer.location }}</p>
      </div>
    </div>

    <p class="footer__copyright">&copy; Daniel Korbmacher {{ year }}</p>

    <nav class="footer__nav" [attr.aria-label]="t().footer.navigation">
      <a class="footer__link" [href]="githubUrl" target="_blank" rel="noopener noreferrer">
        <span class="footer__marker" aria-hidden="true"></span>
        Github
      </a>
      <a class="footer__link" [href]="linkedinUrl" target="_blank" rel="noopener noreferrer">
        <span class="footer__marker" aria-hidden="true"></span>
        LinkedIn
      </a>
      <a class="footer__link" [href]="mailto">
        <span class="footer__marker" aria-hidden="true"></span>
        {{ t().footer.email }}
      </a>
      <a class="footer__link" routerLink="/legal-notice">
        <span class="footer__marker" aria-hidden="true"></span>
        {{ t().footer.legalNotice }}
      </a>
    </nav>
  </div>
</footer>

<header>
    <div class="container">
        <button
            class="header-burger"
            type="button"
            id="header-menu-toggle"
            aria-controls="header-menu"
            [attr.aria-expanded]="menuOpen()"
            [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
            (click)="toggleMenu()"
        >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </button>

        <div class="header-navigation" id="header-menu">
            <div class="language-switch">
            @for (lang of languages; track lang) {
                <button
                type="button"
                [attr.aria-pressed]="language() === lang"
                [attr.aria-label]="lang === 'EN' ? 'Switch to English' : 'Auf Deutsch umschalten'"
                (click)="selectLanguage(lang)"
                >
                {{ lang }}
                </button>
            }
            </div>
            <nav aria-label="Main navigation">
            @for (link of navLinks; track link.id) {
                <a
                [href]="link.href"
                [class.is-active]="activeLink() === link.id"
                [attr.aria-current]="activeLink() === link.id ? 'true' : null"
                (click)="selectLink(link.id)"
                >{{ link.label }}</a>
            }
            </nav>
        </div>
            <a class="header-logo" href="#" aria-label="Back to top">
                <img class="header-logo-default" src="logo/logo.png" alt="Daniel Korbmacher logo" width="814" height="214" />
                <img class="header-logo-hover" src="logo/logo1.png" alt="" aria-hidden="true" width="814" height="214" />
            </a>
    </div>
</header>

<header>
    <div class="container">
        <div class="header-navigation">
            <div class="language-switch">
            @for (lang of languages; track lang) {
                <button
                type="button"
                [attr.aria-pressed]="language() === lang"
                [attr.aria-label]="lang === 'EN' ? 'Switch to English' : 'Auf Deutsch umschalten'"
                (click)="selectLanguage(lang)"
                >
                {{ lang }}
                </button>
            }
            </div>
            <nav aria-label="Main navigation">
                <a href="#about">About me</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
            </nav>
        </div>
            <a class="header-logo" href="#" aria-label="Back to top">
                <img class="header-logo-default" src="logo/logo.png" alt="Daniel Korbmacher logo" width="814" height="214" />
                <img class="header-logo-hover" src="logo/logo1.png" alt="" aria-hidden="true" width="814" height="214" />
            </a>
    </div>
</header>

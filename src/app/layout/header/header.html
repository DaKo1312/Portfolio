<header>
    <div class="container">
        <div class="header-navigation">
            <div class="language-switch">
            @for (lang of languages; track lang) {
                <button
                type="button"
                [attr.aria-pressed]="language() === lang"
                [attr.aria-label]="lang === 'EN' ? 'Switch to English' : 'Auf Deutsch umschalten'"
                (click)="selectLanguage(lang)"
                >
                {{ lang }}
                </button>
            }
            </div>
            <nav aria-label="Main navigation">
                <a
                href="#about"
                [class.is-active]="activeLink() === 'about'"
                [attr.aria-current]="activeLink() === 'about' ? 'true' : null"
                (click)="activeLink.set('about')"
                >About me</a>
                <a
                href="#skills"
                [class.is-active]="activeLink() === 'skills'"
                [attr.aria-current]="activeLink() === 'skills' ? 'true' : null"
                (click)="activeLink.set('skills')"
                >Skills</a>
                <a
                href="#projects"
                [class.is-active]="activeLink() === 'projects'"
                [attr.aria-current]="activeLink() === 'projects' ? 'true' : null"
                (click)="activeLink.set('projects')"
                >Projects</a>
            </nav>
        </div>
            <a class="header-logo" href="#" aria-label="Back to top">
                <img class="header-logo-default" src="logo/logo.png" alt="Daniel Korbmacher logo" width="814" height="214" />
                <img class="header-logo-hover" src="logo/logo1.png" alt="" aria-hidden="true" width="814" height="214" />
            </a>
    </div>
</header>

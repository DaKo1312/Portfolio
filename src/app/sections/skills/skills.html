<section class="skills" id="skills">
  <div class="skills__inner">
    <div class="skills__intro">
      <p class="skills__eyebrow">{{ t().skills.eyebrow }}</p>

      <article class="skills__card">
        <h2 class="skills__title">{{ t().skills.title }}</h2>

        <div class="skills__body">
          <p class="skills__text">{{ t().skills.text }}</p>

          <div class="skills__cta">
            <p class="skills__cta-title">{{ t().skills.ctaTitle }}</p>
            <p class="skills__cta-text">{{ t().skills.ctaText }}</p>
          </div>

          <a class="skills__button" href="#contact">
            <span class="skills__button-label">{{ t().skills.button }}</span>
          </a>
        </div>
      </article>
    </div>

    <ul class="skills__list">
      @for (skill of skills(); track skill.name) {
        <li class="skills__item">
          <img class="skills__icon" [src]="skill.icon" alt="" aria-hidden="true" />
          <span class="skills__label">{{ skill.name }}</span>
        </li>
      }
    </ul>
  </div>
</section>

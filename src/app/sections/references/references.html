<section class="references" id="references" aria-labelledby="references-title">
  <div class="references__inner">
    <h2 class="references__title" id="references-title">What my colleagues say about me</h2>

    <div class="references__viewport">
      <ul
        class="references__track"
        [class.references__track--animated]="animated()"
        [style.transform]="trackTransform()"
        (transitionend)="onTrackSettled($event)"
      >
        @for (slide of slides(); track $index; let index = $index) {
          <li class="references__slide" [class.references__slide--active]="index === position()">
            <figure class="reference">
              <blockquote class="reference__quote">{{ slide.quote }}</blockquote>
              <figcaption class="reference__meta">
                <span class="reference__rule" aria-hidden="true"></span>
                <span class="reference__author">{{ slide.author }} - {{ slide.role }}</span>
              </figcaption>
            </figure>
          </li>
        }
      </ul>
      <span class="references__mark" aria-hidden="true">&ldquo;</span>
      <span class="references__fade" aria-hidden="true"></span>
    </div>

    <div class="references__controls">
      <button
        class="references__arrow"
        type="button"
        aria-label="Show previous reference"
        (click)="previous()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="backIcon" />
        </svg>
      </button>

      <div class="references__dots">
        @for (reference of references(); track reference.author; let index = $index) {
          <button
            class="references__dot"
            type="button"
            [class.references__dot--active]="index === activeIndex()"
            [attr.aria-current]="index === activeIndex() ? 'true' : null"
            [attr.aria-label]="'Show reference ' + (index + 1)"
            (click)="select(index)"
          ></button>
        }
      </div>

      <button
        class="references__arrow"
        type="button"
        aria-label="Show next reference"
        (click)="next()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path [attr.d]="forwardIcon" />
        </svg>
      </button>
    </div>
  </div>
</section>

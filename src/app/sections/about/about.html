<section class="about" id="about">
    <div class="about__inner">
        <div class="about__photo">
            @if (photo(); as src) {
            <img class="about__photo-image" [src]="src" alt="Portrait of Daniel Korbmacher" />
            }
        </div>
        <div class="about__content">
            <p class="about__eyebrow">Who I Am</p>
            <div class="about__card">
                <h2 class="about__title">About me</h2>
                <div class="about__body">
                    <p class="about__intro">{{ intro() }}</p>
                    <ul class="about__highlights">
                        @for (highlight of highlights(); track highlight.text) {
                        <li class="about__highlight">
                            <span class="about__icon" aria-hidden="true">
                                @switch (highlight.icon) {
                                @case ('location') {
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z" />
                                </svg>
                                }
                                @case ('cognition') {
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M9 2h6v2h-6V2Zm0 18h6v2h-6v-2ZM2 9h2v6H2V9Zm18 0h2v6h-2V9ZM7 4h10a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Zm0 2a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H7Zm2 2h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" />
                                </svg>
                                }
                                @case ('releases') {
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="m12 1.5 2.35 3.06 3.67-1.06.4 3.83 3.58 1.36-2.1 3.21 2.1 3.21-3.58 1.36-.4 3.83-3.67-1.06L12 22.5l-2.35-3.06-3.67 1.06-.4-3.83L2 15.31l2.1-3.21L2 8.89l3.58-1.36.4-3.83 3.67 1.06L12 1.5Zm-1 5.5v6h2V7h-2Zm0 8v2h2v-2h-2Z" />
                                </svg>
                                }
                                }
                            </span>
                            <p class="about__highlight-text">{{ highlight.text }}</p>
                        </li>
                        }
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
